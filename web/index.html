<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Council</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2322232a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-opacity='.3'/%3E%3Ccircle cx='16' cy='7' r='2.2' fill='%23fff'/%3E%3Ccircle cx='8.2' cy='20.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='23.8' cy='20.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%233b82f6'/%3E%3C/svg%3E"
    />
    <style>
      /* First-paint backgrounds, before the stylesheet loads. Keep in sync with
         --background in src/styles/tokens.css (paper-50 / ink-950). */
      html { background: oklch(0.988 0.0025 95); color-scheme: light; }
      html.dark { background: oklch(0.145 0.005 265); color-scheme: dark; }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem("council.theme");
          var dark = p === "dark" || ((!p || p === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
